<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEEL RUNNER — 16-bit Platformer</title>
</head>
<body>
<!-- =====================================================
  HUB PAGE: menu + settings. START opens levels/level1.html;
  each level page continues to the next, and the boss level
  returns here after victory.
  Deep-link any level: index.html?level=3
===================================================== -->
<script>
  const q = new URLSearchParams(location.search).get('level');
  if (q && Number(q) >= 1 && Number(q) <= 5) {
    location.href = 'levels/level' + Number(q) + '.html';
  }
</script>
<script src="boot.js"></script>
</body>
</html>
