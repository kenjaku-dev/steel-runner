<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEEL RUNNER — 16-bit Platformer</title>
</head>
<body>
<!-- =====================================================
  HUB PAGE: menu + settings + full game (levels 1 -> 5).
  All page structure & scripts come from boot.js (single source).
  Deep-link any level: index.html?level=3
===================================================== -->
<script>
  const lvl = new URLSearchParams(location.search).get('level');
  if (lvl && Number(lvl) >= 1 && Number(lvl) <= 5) window.__START_LEVEL = Number(lvl);
</script>
<script src="boot.js"></script>
</body>
</html>
